      <path d="M 328 -120 C 332 40, 328 110, 314 148 C 322 108, 324 40, 320 -120 Z" fill="#fff1e2" opacity=".9"/>
      <!-- left crop falls off -->
      <path d="M 12 620 C 18 432, 42 326, 94 270 C 56 348, 44 460, 46 620 Z" fill="#dea283" opacity=".45"/>
    </g>

    <!-- ===== champagne-gold bustier ===== -->
    <use href="#topPath" fill="url(#gold)"/>
    <g clip-path="url(#topClip)">
      <!-- inner-cup shadows meeting at the gore -->
      <path d="M 334 434 C 356 486, 368 566, 370 700 L 286 700 C 300 574, 316 490, 334 434 Z" fill="#6b4a14" opacity=".22"/>
      <path d="M 466 434 C 444 486, 432 566, 430 700 L 514 700 C 500 574, 484 490, 466 434 Z" fill="#6b4a14" opacity=".3"/>
      <!-- centre seam -->
