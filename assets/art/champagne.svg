<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- ===== JUGGS glossy cel kit ===== -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd8a6"/>
      <stop offset="0.5" stop-color="#f9a78b"/>
      <stop offset="1" stop-color="#e97a8d"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#3b0b4e"/>
      <stop offset="0.5" stop-color="#6a1d86"/>
      <stop offset="1" stop-color="#2d0740"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffeaff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#ffeaff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- irregular glitter tile -->
    <pattern id="glitter" width="140" height="140" patternUnits="userSpaceOnUse">
      <g fill="#fff">
        <circle cx="7" cy="12" r="1.2" opacity=".9"/><circle cx="31" cy="5" r=".7" opacity=".6"/><circle cx="52" cy="21" r="1.5" opacity=".95"/>
        <circle cx="19" cy="38" r=".9" opacity=".5"/><circle cx="88" cy="9" r="1.0" opacity=".8"/><circle cx="121" cy="27" r=".6" opacity=".7"/>
        <circle cx="66" cy="47" r=".8" opacity=".85"/><circle cx="103" cy="52" r="1.3" opacity=".9"/><circle cx="135" cy="61" r=".7" opacity=".5"/>
        <circle cx="12" cy="70" r="1.1" opacity=".75"/><circle cx="44" cy="79" r=".6" opacity=".9"/><circle cx="79" cy="84" r="1.6" opacity=".7"/>
        <circle cx="116" cy="92" r=".9" opacity=".6"/><circle cx="27" cy="104" r="1.4" opacity=".85"/><circle cx="58" cy="117" r=".7" opacity=".95"/>
        <circle cx="94" cy="122" r="1.0" opacity=".55"/><circle cx="132" cy="112" r="1.2" opacity=".8"/><circle cx="8" cy="131" r=".8" opacity=".7"/>
        <circle cx="70" cy="136" r=".6" opacity=".6"/><circle cx="41" cy="58" r=".5" opacity=".9"/><circle cx="99" cy="33" r=".5" opacity=".8"/>
        <circle cx="123" cy="76" r=".5" opacity=".7"/><circle cx="19" cy="90" r=".5" opacity=".9"/><circle cx="84" cy="105" r=".5" opacity=".6"/>
      </g>
    </pattern>
    <symbol id="sparkle" viewBox="-1 -1 2 2">
      <path d="M0 -1 C0.07 -0.28 0.28 -0.07 1 0 C0.28 0.07 0.07 0.28 0 1 C-0.07 0.28 -0.28 0.07 -1 0 C-0.28 -0.07 -0.07 -0.28 0 -1Z" fill="#fff"/>
      <path d="M0 -0.42 C0.03 -0.12 0.12 -0.03 0.42 0 C0.12 0.03 0.03 0.12 0 0.42 C-0.03 0.12 -0.12 0.03 -0.42 0 C-0.12 -0.03 -0.03 -0.12 0 -0.42Z" fill="#fff" transform="rotate(45)"/>
    </symbol>

    <!-- ===== added for this piece ===== -->
    <linearGradient id="gold" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#e2b866"/>
      <stop offset="0.35" stop-color="#c2913f"/>
      <stop offset="0.7" stop-color="#9a6b26"/>
      <stop offset="1" stop-color="#6b4a14"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#fff1c9" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff1c9" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fffdf2" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#fff1c9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff1c9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldChrome" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#6b4a14" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#8a6320"/>
      <stop offset="0.34" stop-color="#f0d08a"/>
      <stop offset="0.48" stop-color="#fffdf2"/>
      <stop offset="0.6" stop-color="#e8c169"/>
      <stop offset="0.82" stop-color="#8a6320"/>
      <stop offset="1" stop-color="#6b4a14" stop-opacity="0"/>
    </linearGradient>

    <path id="skinPath" d="M 330 -120 C 334 40, 330 112, 314 148 C 248 172, 158 202, 94 270 C 42 326, 18 432, 12 620 L 800 620 C 794 432, 770 326, 718 270 C 654 202, 564 172, 498 148 C 482 112, 478 40, 482 -120 Z"/>
    <path id="topPath" d="M -60 452 C 40 396, 148 322, 232 316 C 310 310, 352 390, 400 458 C 448 390, 490 310, 568 316 C 652 322, 760 396, 860 452 L 860 700 L -60 700 Z"/>
    <path id="strandA" d="M -20 96 C 100 240, 250 410, 400 428 C 560 450, 700 330, 820 140"/>
    <path id="strandB" d="M 60 176 C 140 330, 250 500, 400 520 C 560 542, 680 400, 760 200"/>
    <clipPath id="skinClip"><use href="#skinPath"/></clipPath>
    <clipPath id="topClip"><use href="#topPath"/></clipPath>
    <clipPath id="figClip"><use href="#skinPath"/><use href="#topPath"/></clipPath>

    <g id="pearl">
      <circle r="1" fill="#f1e4d7"/>
      <path d="M 0.98 -0.2 A 1 1 0 0 1 -0.62 0.78 C -0.05 0.66, 0.46 0.28, 0.6 -0.42 C 0.76 -0.36, 0.92 -0.3, 0.98 -0.2 Z" fill="#c9a189"/>
      <path d="M 0.62 0.62 A 1 1 0 0 1 -0.62 0.78 C -0.1 0.78, 0.3 0.74, 0.62 0.62 Z" fill="#ffd0ab" opacity=".8"/>
      <circle cx="-0.34" cy="-0.42" r="0.27" fill="#fff"/>
      <circle cx="-0.12" cy="-0.68" r="0.1" fill="#fff" opacity=".8"/>
      <circle cx="0.26" cy="0.5" r="0.12" fill="#fff" opacity=".5"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="100" cy="40" rx="420" ry="300" fill="url(#glow)" opacity=".6"/>

  <!-- extreme close crop: push the whole figure (and the pearls) in -->
  <g transform="translate(400 300) scale(1.25) translate(-400 -340)">

    <!-- ===== skin ===== -->
    <use href="#skinPath" fill="#f4caa8"/>
    <g clip-path="url(#skinClip)">
      <!-- broad form shadow, far (right) side -->
      <path d="M 470 -120 C 478 60, 512 150, 588 210 C 682 284, 742 420, 752 620 L 820 620 L 820 -120 Z" fill="#e7b193"/>
      <path d="M 560 -120 C 566 60, 606 168, 676 232 C 738 290, 774 424, 780 620 L 820 620 L 820 -120 Z" fill="#dea283"/>
      <!-- trapezius / shoulder planes -->
      <path d="M 314 148 C 250 172, 160 202, 96 270 C 152 228, 242 192, 322 174 Z" fill="#dea283" opacity=".6"/>
      <path d="M 498 148 C 564 172, 654 202, 718 270 C 662 226, 574 194, 492 174 Z" fill="#c7876a" opacity=".6"/>
      <!-- collarbones -->
      <path d="M 168 236 C 244 206, 318 202, 366 226" fill="none" stroke="#c98a6a" stroke-width="7" stroke-linecap="round" opacity=".45"/>
      <path d="M 636 236 C 560 206, 486 202, 438 226" fill="none" stroke="#b5785a" stroke-width="7" stroke-linecap="round" opacity=".5"/>
      <path d="M 172 248 C 246 220, 316 216, 362 238" fill="none" stroke="#fce8d6" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
      <!-- sternum notch -->
      <path d="M 388 244 C 396 236, 410 236, 418 244 C 410 258, 396 258, 388 244 Z" fill="#c7876a" opacity=".6"/>

      <!-- ===== the two swells: explicit mound shapes above the neckline ===== -->
      <path d="M -60 392 C 20 316, 150 262, 252 280 C 324 292, 372 336, 398 396 L 400 456 C 352 390, 310 310, 232 316 C 148 322, 40 396, -60 452 Z" fill="#fbd7ba"/>
      <path d="M 4 386 C 80 312, 172 274, 258 290 C 178 296, 94 334, 36 406 Z" fill="#fff0dc"/>
      <path d="M 860 392 C 780 316, 650 262, 548 280 C 476 292, 428 336, 402 396 L 400 456 C 448 390, 490 310, 568 316 C 652 322, 760 396, 860 452 Z" fill="#e8b795"/>
      <path d="M 796 386 C 720 312, 628 274, 542 290 C 622 296, 706 334, 764 406 Z" fill="#f6cdad" opacity=".85"/>
      <!-- occlusion band where the fabric meets the skin: thickest at the gore -->
      <path d="M -60 430 C 52 372, 160 292, 232 288 C 320 282, 356 350, 400 424 C 444 350, 480 282, 568 288 C 640 292, 748 372, 860 430 L 860 452 C 760 396, 652 322, 568 316 C 490 310, 448 390, 400 458 C 352 390, 310 310, 232 316 C 148 322, 40 396, -60 452 Z" fill="#dea283"/>
      <path d="M 268 306 C 330 318, 364 376, 400 436 C 436 376, 470 318, 532 306 C 474 326, 442 392, 400 458 C 358 392, 326 326, 268 306 Z" fill="#c7876a"/>
      <!-- cleavage crease -->
      <path d="M 400 378 C 392 404, 387 428, 388 452 L 412 452 C 413 428, 408 404, 400 378 Z" fill="#b5785a"/>
      <path d="M 398 410 C 393 426, 390 440, 390 452 L 410 452 C 410 440, 407 426, 402 410 Z" fill="#a9674c"/>
