      <path d="M 268 330 C 254 432, 248 552, 252 700" fill="none" stroke="#f6dfab" stroke-width="1.6" opacity=".38"/>
      <path d="M 538 330 C 552 432, 558 552, 554 700" fill="none" stroke="#6b4a14" stroke-width="3" opacity=".38"/>
      <!-- glitter -->
      <rect x="-60" y="300" width="920" height="400" fill="url(#glitter)" opacity=".5"/>
    </g>
    <!-- neckline edge light -->
    <path d="M -60 452 C 40 396, 148 322, 232 316 C 310 310, 352 390, 400 458 C 448 390, 490 310, 568 316 C 652 322, 760 396, 860 452" fill="none" stroke="#fff1c9" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 10 428 C 96 376, 172 314, 238 310" fill="none" stroke="#fffdf2" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>

