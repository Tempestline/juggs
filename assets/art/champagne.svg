      <path d="M -60 566 C 40 510, 148 436, 232 430 C 310 424, 352 504, 400 572 C 448 504, 490 424, 568 430 C 652 436, 760 510, 860 566" fill="none" stroke="#6b4a14" stroke-width="4" opacity=".5"/>
      <path d="M -60 558 C 40 502, 148 428, 232 422 C 310 416, 352 496, 400 564" fill="none" stroke="#f6dfab" stroke-width="2.2" opacity=".4"/>
