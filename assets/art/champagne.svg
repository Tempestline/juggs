      <path d="M 692 420 C 650 350, 568 328, 496 372 C 454 398, 428 452, 416 502 C 442 442, 484 396, 538 386 C 600 374, 658 400, 688 466 Z" fill="url(#goldSheen)" opacity=".45"/>
      <!-- hard chrome band -->
      <path d="M 186 372 C 212 348, 244 344, 268 358 C 254 440, 238 540, 230 700 L 158 700 C 168 540, 178 440, 186 372 Z" fill="url(#goldChrome)" opacity=".9"/>
      <path d="M 602 382 C 584 358, 560 350, 540 360 C 552 440, 566 540, 574 700 L 620 700 C 614 540, 606 442, 602 382 Z" fill="url(#goldChrome)" opacity=".45"/>
      <!-- boning, curving with the cup -->
