    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e2b0"/><stop offset="1" stop-color="#9a6e26"/>
    </linearGradient>
    <clipPath id="cA"><circle cx="220" cy="520" r="128"/></clipPath>
    <clipPath id="cB"><circle cx="392" cy="486" r="112"/></clipPath>
  </defs>
  <g transform="translate(300 400) rotate(-8) translate(-300 -400)">
    <ellipse cx="300" cy="660" rx="200" ry="26" fill="#a9345a" opacity=".22"/>
    <path d="M 300 96 C 268 190, 222 280, 220 392" fill="none" stroke="url(#stemG)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 300 96 C 334 180, 386 260, 392 374" fill="none" stroke="url(#stemG)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 296 100 C 266 190, 224 278, 222 388" fill="none" stroke="#fff3cf" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <path d="M 304 100 C 336 184, 384 262, 390 372" fill="none" stroke="#fff3cf" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <path d="M 300 96 C 350 40, 430 40, 470 84 C 420 120, 350 122, 300 96 Z" fill="url(#leafG)"/>
    <path d="M 300 96 C 350 60, 410 58, 456 82 C 400 84, 350 90, 300 96 Z" fill="#fff8e0" opacity=".7"/>
    <path d="M 300 96 C 350 92, 410 90, 462 86" fill="none" stroke="#7a5418" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
    <circle cx="392" cy="486" r="112" fill="url(#cherryG)"/>
    <g clip-path="url(#cB)">
      <path d="M 392 374 C 470 380, 520 450, 500 540 C 480 610, 400 620, 360 600 C 450 590, 480 520, 460 460 C 440 410, 410 390, 392 374 Z" fill="#3d0410" opacity=".85"/>
      <path d="M 300 430 C 330 400, 372 396, 404 420 C 380 424, 348 440, 330 470 C 316 460, 306 446, 300 430 Z" fill="#ffd9de" opacity=".95"/>
      <path d="M 286 470 C 296 480, 306 500, 300 530 C 292 508, 286 490, 286 470 Z" fill="#fff" opacity=".8"/>
      <path d="M 300 560 C 340 592, 420 600, 480 560 C 440 606, 350 604, 300 560 Z" fill="#ff8a9c" opacity=".55"/>
      <rect x="280" y="374" width="224" height="224" fill="url(#glitter)" opacity=".55"/>
      <circle cx="392" cy="378" r="9" fill="#3d0410" opacity=".9"/>
    </g>
    <circle cx="220" cy="520" r="128" fill="url(#cherryG)"/>
    <g clip-path="url(#cA)">
      <path d="M 220 392 C 310 398, 360 470, 340 570 C 320 650, 230 660, 190 640 C 290 620, 320 540, 300 480 C 280 430, 250 410, 220 392 Z" fill="#3d0410" opacity=".85"/>
      <path d="M 116 460 C 150 424, 200 420, 236 446 C 210 452, 172 470, 152 506 C 136 494, 124 478, 116 460 Z" fill="#ffd9de" opacity=".95"/>
      <path d="M 100 506 C 112 520, 124 546, 116 580 C 106 554, 100 528, 100 506 Z" fill="#fff" opacity=".8"/>
      <path d="M 118 600 C 168 640, 258 648, 326 600 C 280 660, 170 656, 118 600 Z" fill="#ff8a9c" opacity=".55"/>
      <rect x="92" y="392" width="256" height="256" fill="url(#glitter)" opacity=".55"/>
      <circle cx="220" cy="396" r="10" fill="#3d0410" opacity=".9"/>
    </g>
    <use href="#sparkle" x="150" y="450" width="54" height="54" transform="translate(-27 -27)"/>
    <use href="#sparkle" x="330" y="424" width="36" height="36" transform="translate(-18 -18)"/>
    <use href="#sparkle" x="452" y="92" width="26" height="26" transform="translate(-13 -13)"/>
    <use href="#sparkle" x="112" y="590" width="20" height="20" transform="translate(-10 -10)"/>
    <use href="#sparkle" x="470" y="560" width="22" height="22" transform="translate(-11 -11)"/>
