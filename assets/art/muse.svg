      <path d="M 70 330 C 120 284, 178 246, 216 254 C 262 264, 284 316, 300 352 C 316 316, 338 264, 384 254 C 422 246, 480 284, 530 330 L 530 314 C 480 266, 422 228, 384 238 C 338 248, 316 298, 300 334 C 284 298, 262 248, 216 238 C 178 228, 120 266, 70 314 Z" fill="#a9674c" opacity=".62"/>
      <path d="M 78 616 C 150 650, 450 650, 522 616 C 516 690, 508 780, 506 900 L 94 900 C 96 780, 88 690, 78 616 Z" fill="#d9a07f" opacity=".7"/>
