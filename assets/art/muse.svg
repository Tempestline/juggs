    <path d="M 70 330 C 120 284, 178 246, 216 254 C 262 264, 284 316, 300 352 C 316 316, 338 264, 384 254 C 422 246, 480 284, 530 330" fill="none" stroke="#f9e2ff" stroke-width="3.5" stroke-linecap="round" opacity=".95"/>
    <path d="M 78 616 C 150 636, 450 636, 522 616" fill="none" stroke="#20052c" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <use href="#sparkle" x="190" y="248" width="48" height="48" transform="translate(-24 -24)"/>
    <use href="#sparkle" x="430" y="292" width="30" height="30" transform="translate(-15 -15)"/>
    <use href="#sparkle" x="180" y="590" width="24" height="24" transform="translate(-12 -12)"/>
    <use href="#sparkle" x="120" y="332" width="18" height="18" transform="translate(-9 -9)"/>
