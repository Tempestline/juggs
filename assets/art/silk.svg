<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- ===== JUGGS glossy cel kit ===== -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd8a6"/>
      <stop offset="0.5" stop-color="#f9a78b"/>
      <stop offset="1" stop-color="#e97a8d"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#3b0b4e"/>
      <stop offset="0.5" stop-color="#6a1d86"/>
      <stop offset="1" stop-color="#2d0740"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffeaff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#ffeaff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- irregular glitter tile -->
    <pattern id="glitter" width="140" height="140" patternUnits="userSpaceOnUse">
      <g fill="#fff">
        <circle cx="7" cy="12" r="1.2" opacity=".9"/><circle cx="31" cy="5" r=".7" opacity=".6"/><circle cx="52" cy="21" r="1.5" opacity=".95"/>
        <circle cx="19" cy="38" r=".9" opacity=".5"/><circle cx="88" cy="9" r="1.0" opacity=".8"/><circle cx="121" cy="27" r=".6" opacity=".7"/>
        <circle cx="66" cy="47" r=".8" opacity=".85"/><circle cx="103" cy="52" r="1.3" opacity=".9"/><circle cx="135" cy="61" r=".7" opacity=".5"/>
        <circle cx="12" cy="70" r="1.1" opacity=".75"/><circle cx="44" cy="79" r=".6" opacity=".9"/><circle cx="79" cy="84" r="1.6" opacity=".7"/>
        <circle cx="116" cy="92" r=".9" opacity=".6"/><circle cx="27" cy="104" r="1.4" opacity=".85"/><circle cx="58" cy="117" r=".7" opacity=".95"/>
        <circle cx="94" cy="122" r="1.0" opacity=".55"/><circle cx="132" cy="112" r="1.2" opacity=".8"/><circle cx="8" cy="131" r=".8" opacity=".7"/>
        <circle cx="70" cy="136" r=".6" opacity=".6"/><circle cx="41" cy="58" r=".5" opacity=".9"/><circle cx="99" cy="33" r=".5" opacity=".8"/>
        <circle cx="123" cy="76" r=".5" opacity=".7"/><circle cx="19" cy="90" r=".5" opacity=".9"/><circle cx="84" cy="105" r=".5" opacity=".6"/>
      </g>
    </pattern>
    <symbol id="sparkle" viewBox="-1 -1 2 2">
      <path d="M0 -1 C0.07 -0.28 0.28 -0.07 1 0 C0.28 0.07 0.07 0.28 0 1 C-0.07 0.28 -0.28 0.07 -1 0 C-0.28 -0.07 -0.07 -0.28 0 -1Z" fill="#fff"/>
      <path d="M0 -0.42 C0.03 -0.12 0.12 -0.03 0.42 0 C0.12 0.03 0.03 0.12 0 0.42 C-0.03 0.12 -0.12 0.03 -0.42 0 C-0.12 -0.03 -0.03 -0.12 0 -0.42Z" fill="#fff" transform="rotate(45)"/>
    </symbol>

    <!-- ===== added for this piece ===== -->
    <linearGradient id="chromeP" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0" stop-color="#2a0638"/>
      <stop offset="0.22" stop-color="#5a1478"/>
      <stop offset="0.38" stop-color="#c78ae6"/>
      <stop offset="0.47" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f0d4ff"/>
      <stop offset="0.66" stop-color="#7a2a9c"/>
      <stop offset="0.84" stop-color="#33073f"/>
      <stop offset="1" stop-color="#9a52c0"/>
    </linearGradient>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a2f52" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7a2f52" stop-opacity="0"/>
    </radialGradient>

    <path id="parenPath" d="M 8 -119 C -12 -86, -32 -44, -32 0 C -32 44, -12 86, 8 119 C 16 127, 30 127, 40 119 C 24 82, 18 42, 18 0 C 18 -42, 24 -82, 40 -119 C 30 -127, 16 -127, 8 -119 Z"/>
    <path id="dotPath" d="M 32 0 A 32 32 0 1 1 -32 0 A 32 32 0 1 1 32 0 Z"/>
    <clipPath id="parenClip" clipPathUnits="userSpaceOnUse"><use href="#parenPath"/></clipPath>
    <clipPath id="dotClip" clipPathUnits="userSpaceOnUse"><use href="#dotPath"/></clipPath>

    <g id="parenSide">
      <use href="#parenPath" fill="#14021d" transform="translate(14.0 16.0)"/>
      <use href="#parenPath" fill="#1a0325" transform="translate(12.3 14.0)"/>
      <use href="#parenPath" fill="#21052e" transform="translate(10.5 12.0)"/>
      <use href="#parenPath" fill="#2b073b" transform="translate(8.8 10.0)"/>
      <use href="#parenPath" fill="#360a48" transform="translate(7.0 8.0)"/>
      <use href="#parenPath" fill="#410e56" transform="translate(5.3 6.0)"/>
      <use href="#parenPath" fill="#4d1364" transform="translate(3.5 4.0)"/>
      <use href="#parenPath" fill="#5a1a74" transform="translate(1.8 2.0)"/>
    </g>
    <g id="dotSide">
      <use href="#dotPath" fill="#14021d" transform="translate(14.0 16.0)"/>
      <use href="#dotPath" fill="#1a0325" transform="translate(12.3 14.0)"/>
      <use href="#dotPath" fill="#21052e" transform="translate(10.5 12.0)"/>
      <use href="#dotPath" fill="#2b073b" transform="translate(8.8 10.0)"/>
      <use href="#dotPath" fill="#360a48" transform="translate(7.0 8.0)"/>
      <use href="#dotPath" fill="#410e56" transform="translate(5.3 6.0)"/>
      <use href="#dotPath" fill="#4d1364" transform="translate(3.5 4.0)"/>
      <use href="#dotPath" fill="#5a1a74" transform="translate(1.8 2.0)"/>
    </g>

    <g id="parenGlyph">
      <use href="#parenPath" fill="url(#purple)"/>
      <g clip-path="url(#parenClip)">
        <rect x="-40" y="-135" width="90" height="270" fill="url(#chromeP)" opacity=".88"/>
        <path d="M -34 -68 C -18 -80, 0 -76, 22 -58 C 0 -42, -16 -38, -34 -46 Z" fill="url(#sheen)" opacity=".45"/>
        <path d="M -34 44 C -18 32, 0 36, 22 54 C 0 70, -16 72, -34 62 Z" fill="url(#sheen)" opacity=".26"/>
        <path d="M 8 -110 C -10 -80, -27 -42, -27 2 L -18 7 C -18 -36, -2 -74, 15 -103 Z" fill="#ffffff" opacity=".8"/>
        <path d="M -24 34 C -20 62, -8 90, 6 112 L -3 116 C -18 94, -30 64, -33 36 Z" fill="#ffffff" opacity=".35"/>
        <path d="M 24 44 C 26 74, 32 96, 40 112 L 31 115 C 24 98, 18 74, 16 44 Z" fill="#e7c9ff" opacity=".3"/>
        <rect x="-40" y="-135" width="90" height="270" fill="url(#glitter)" opacity=".7"/>
      </g>
      <path d="M 8 -119 C -12 -86, -32 -44, -32 0 C -32 44, -12 86, 8 119" fill="none" stroke="#f9e2ff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      <path d="M 40 -119 C 24 -82, 18 -42, 18 0 C 18 42, 24 82, 40 119" fill="none" stroke="#1d0428" stroke-width="3" stroke-linecap="round" opacity=".45"/>
      <path d="M 8 -119 C 16 -127, 30 -127, 40 -119" fill="none" stroke="#f9e2ff" stroke-width="2.6" stroke-linecap="round" opacity=".5"/>
    </g>

    <g id="dotGlyph">
      <use href="#dotPath" fill="url(#purple)"/>
      <g clip-path="url(#dotClip)">
        <rect x="-36" y="-36" width="72" height="72" fill="url(#chromeP)" opacity=".82"/>
        <path d="M 32 4 A 32 32 0 0 1 -18 30 C 4 28, 22 18, 32 4 Z" fill="#2d0740" opacity=".55"/>
        <path d="M -31 -6 A 32 32 0 0 1 2 -32 C -12 -24, -23 -14, -27 -2 Z" fill="#f3d9ff" opacity=".55"/>
        <path d="M 30 14 A 32 32 0 0 1 -14 31 C 6 30, 22 24, 30 14 Z" fill="#d9a8ef" opacity=".8"/>
        <rect x="-36" y="-36" width="72" height="72" fill="url(#glitter)" opacity=".8"/>
      </g>
      <circle cx="-12" cy="-15" r="7" fill="#fff"/>
      <circle cx="-1" cy="-23" r="3.2" fill="#fff" opacity=".85"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="130" cy="70" rx="420" ry="300" fill="url(#glow)" opacity=".55"/>
  <ellipse cx="400" cy="300" rx="380" ry="250" fill="url(#glow)" opacity=".35"/>
  <!-- ground shadow under the lockup -->
  <ellipse cx="408" cy="476" rx="340" ry="58" fill="url(#shade)"/>

  <!-- ===== the lockup: ( . )( . ) ===== -->
  <g transform="translate(400 300) scale(1.25) translate(-400 -300)">
    <use href="#parenSide" transform="translate(165 300)"/>
    <use href="#dotSide" transform="translate(250 300) scale(1.12)"/>
    <use href="#parenSide" transform="translate(335 300) scale(-1 1)"/>
    <use href="#parenSide" transform="translate(457 300)"/>
    <use href="#dotSide" transform="translate(542 300) scale(1.12)"/>
    <use href="#parenSide" transform="translate(627 300) scale(-1 1)"/>

    <use href="#parenGlyph" transform="translate(165 300)"/>
    <use href="#parenGlyph" transform="translate(335 300) scale(-1 1)"/>
    <use href="#parenGlyph" transform="translate(457 300)"/>
    <use href="#parenGlyph" transform="translate(627 300) scale(-1 1)"/>
    <use href="#dotGlyph" transform="translate(250 300) scale(1.12)"/>
    <use href="#dotGlyph" transform="translate(542 300) scale(1.12)"/>
  </g>

  <!-- ===== sparkles ===== -->
  <use href="#sparkle" x="96" y="176" width="58" height="58" transform="translate(-29 -29)"/>
  <use href="#sparkle" x="198" y="212" width="28" height="28" transform="translate(-14 -14)"/>
  <use href="#sparkle" x="524" y="212" width="22" height="22" transform="translate(-11 -11)"/>
  <use href="#sparkle" x="384" y="152" width="30" height="30" transform="translate(-15 -15)"/>
  <use href="#sparkle" x="714" y="418" width="36" height="36" transform="translate(-18 -18)"/>
  <use href="#sparkle" x="446" y="176" width="22" height="22" transform="translate(-11 -11)"/>
  <use href="#sparkle" x="286" y="470" width="26" height="26" transform="translate(-13 -13)"/>
  <use href="#sparkle" x="620" y="126" width="20" height="20" transform="translate(-10 -10)"/>
  <use href="#sparkle" x="66" y="430" width="24" height="24" transform="translate(-12 -12)"/>
</svg>
